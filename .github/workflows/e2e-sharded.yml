name: e2e sharded (item 8 per-shard narrowing)

# Sharded-only run: the two shards are the ONLY jobs, so each failed test
# belongs to exactly one shard. A TestDino Re-run then narrows each shard to
# only its own failures (no "also ran in another job" ambiguity).
#
# Needs secret TESTDINO_TOKEN; TestDino↔GitHub integration connected.

on:
  # Manual only — trigger with `gh workflow run e2e-sharded.yml --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: e2e-sharded-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  sharded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: e2e-qa
    env:
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_SERVER_URL: ${{ vars.TESTDINO_SERVER_URL || 'https://stg-reporter.testdino.com' }}
      TESTDINO_CI_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run shard ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npx -p @testdino/e2e testdino-e2e run -- --shard ${{ matrix.shard }}/${{ strategy.job-total }}
